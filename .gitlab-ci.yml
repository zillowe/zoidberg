stages:
  - lint
  - metagen
  - generate
  - build
  - publish

variables:
  PUBLISH_VERSION: "latest"
  GIT_DEPTH: "0"

.gpg_setup: &gpg_setup
  - |
    if [ -n "$GPG_PRIVATE_KEY" ]; then
      mkdir -p .gnupg; export GNUPGHOME="$(pwd)/.gnupg"; chmod 700 .gnupg
      echo "allow-loopback-pinentry" > .gnupg/gpg-agent.conf
      echo "pinentry-mode loopback" > .gnupg/gpg.conf
      echo "$GPG_PRIVATE_KEY" | base32 -d | gpg --batch --pinentry-mode loopback --import
      gpgconf --kill gpg-agent
      GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | cut -d: -f5 | head -n 1)
      echo "Imported GPG Key: $GPG_KEY_ID"
      echo "$GPG_KEY_ID" > gpg_key_id.txt
      if [ -n "$GPG_PASSWORD" ]; then
        GPG_PASS=$(echo "$GPG_PASSWORD" | base32 -d)
        KEYGRIP=$(gpg --list-secret-keys --with-keygrip --with-colons "$GPG_KEY_ID" | grep '^grp' | cut -d: -f10 | head -n 1)
        if [ -n "$KEYGRIP" ]; then
          echo "PRESET_PASSPHRASE $KEYGRIP -1 $(echo -n "$GPG_PASS" | xxd -p)" | gpg-connect-agent --no-tty /bye 2>/dev/null || true
        fi
      fi
    fi

.common_before_script: &common_before_script
  - curl -fsSL https://zillowe.pages.dev/scripts/zoi/install.sh | bash
  - export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
  - zoi sync
  - *gpg_setup

.detect_changes: &detect_changes
  - |
    if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
      CHANGED_FILES=$(find . -name "*.pkg.lua" -not -path "*/.*")
    else
      CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep "\.pkg\.lua$" || true)
    fi
    echo "Changed packages: $CHANGED_FILES"

registry-audit:
  stage: lint
  image: archlinux:latest
  before_script:
    - pacman -Syu --noconfirm curl git bash gnupg coreutils
    - *common_before_script
  script:
    - zoi reg check

metadata-generation:
  stage: metagen
  image: archlinux:latest
  rules:
    - if: "$CI_COMMIT_MESSAGE !~ /Security: Update metadata index/"
  before_script:
    - pacman -Syu --noconfirm curl git bash gnupg coreutils
    - *common_before_script
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" ]; then
        TARGET_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      else
        TARGET_BRANCH=$CI_COMMIT_BRANCH
      fi
      git config --global user.email "contact@zillowe.qzz.io"
      git config --global user.name "ZSA Registrar Bot"
      if [ -n "$GPG_PRIVATE_KEY" ]; then
        mkdir -p ~/.gnupg; chmod 700 ~/.gnupg
        echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
        echo "$GPG_PRIVATE_KEY" | base32 -d | gpg --batch --import
        gpgconf --kill gpg-agent
        GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec' | cut -d: -f5 | head -n 1)
        if [ -n "$GPG_KEY_ID" ]; then git config --global user.signingkey "$GPG_KEY_ID"; fi
        if [ -n "$GPG_PASSWORD" ]; then
          GPG_PASS=$(echo "$GPG_PASSWORD" | base32 -d); export GPG_PASS
          printf '#!/bin/sh\nexec gpg --batch --passphrase "$GPG_PASS" --pinentry-mode loopback "$@"\n' > /tmp/git-gpg-wrapper
          chmod +x /tmp/git-gpg-wrapper
          git config --global gpg.program /tmp/git-gpg-wrapper
        fi
      fi
      git remote set-url origin "https://oauth2:${PROJECT_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git fetch origin refs/heads/$TARGET_BRANCH
      git checkout -B $TARGET_BRANCH origin/$TARGET_BRANCH
      zoi reg gen-meta
      if [ -n "$(git status --porcelain)" ]; then
        git add .
        git commit -S -m "Security: Update metadata index [skip ci]"
        git push origin HEAD:$TARGET_BRANCH
      fi

# ── Generate child pipeline (one job per package, all platforms) ──

generate-child:
  stage: generate
  image: archlinux:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pacman -Syu --noconfirm curl git bash coreutils awk jq
    - *common_before_script
  script:
    - *detect_changes
    - |
      if [ -z "$CHANGED_FILES" ]; then
        echo "No packages changed."
        mkdir -p generated
        printf '%s\n' \
          "stages:" \
          "  - build" \
          "" \
          "noop:" \
          "  stage: build" \
          '  script: echo "No packages changed, nothing to build"' \
          "" > generated/child.yml
        exit 0
      fi

      mkdir -p generated

      # Write child pipeline header
      printf '%s\n' \
        "stages:" \
        "  - build" \
        "" \
        "variables:" \
        '  PUBLISH_VERSION: "latest"' \
        "  GIT_DEPTH: \"0\"" \
        "" > generated/child.yml

      for PKG_FILE in $CHANGED_FILES; do
        if [ ! -f "$PKG_FILE" ]; then continue; fi

        PKG_JSON=$(zoi package inspect "$PKG_FILE" --json)
        PKG_NAME=$(echo "$PKG_JSON" | jq -r ".name")
        PKG_REPO=$(echo "$PKG_JSON" | jq -r ".repo")
        PKG_ID=$(echo "$PKG_REPO-$PKG_NAME" | tr '/' '-')
        PLATFORMS=$(echo "$PKG_JSON" | jq -r '.platforms // [] | .[]')
        PKG_VERSION=$(echo "$PKG_JSON" | jq -r ".version")

        # ── Linux target ──
        LINUX_TARGET_LIST=""
        if [ -z "$PLATFORMS" ]; then
          LINUX_TARGET_LIST="linux-amd64 linux-arm64"
        else
          for PLATFORM in $PLATFORMS; do
            case "$PLATFORM" in
              ci:*) T="${PLATFORM#ci:}"; T="${T%%:*}"; R="${PLATFORM##*:}"
                    if [ "$R" = "linux" ]; then LINUX_TARGET_LIST="$LINUX_TARGET_LIST $T"; fi ;;
              linux) LINUX_TARGET_LIST="$LINUX_TARGET_LIST linux-amd64 linux-arm64" ;;
              linux-*) LINUX_TARGET_LIST="$LINUX_TARGET_LIST $PLATFORM" ;;
            esac
          done
        fi
        for TARGET in $LINUX_TARGET_LIST; do
          ARCH=${TARGET#linux-}
          TAG="saas-linux-small-$ARCH"
          printf '%s\n' \
            "build-$TARGET-$PKG_ID:" \
            "  stage: build" \
            "  image: archlinux:latest" \
            "  tags:" \
            "    - $TAG" \
            "  variables:" \
            "    PKG_FILE: \"$PKG_FILE\"" \
            "    TARGET: \"$TARGET\"" \
            "    PKG_VERSION: \"$PKG_VERSION\"" \
            "  before_script:" \
            "    - |" \
            "      pacman -Syu --noconfirm curl git bash gnupg zstd coreutils jq bubblewrap" \
            "      curl -fsSL https://zillowe.pages.dev/scripts/zoi/install.sh | bash" \
            '      export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"' \
            "      zoi sync" \
            '      if [ -n "$GPG_PRIVATE_KEY" ]; then mkdir -p .gnupg; export GNUPGHOME="$(pwd)/.gnupg"; chmod 700 .gnupg; echo "allow-loopback-pinentry" > .gnupg/gpg-agent.conf; echo "pinentry-mode loopback" > .gnupg/gpg.conf; echo "$GPG_PRIVATE_KEY" | base32 -d | gpg --batch --pinentry-mode loopback --import; gpgconf --kill gpg-agent; GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep "^sec" | cut -d: -f5 | head -n 1); echo "$GPG_KEY_ID" > gpg_key_id.txt; fi' \
            '      if [ -n "$GPG_PASSWORD" ]; then export GPG_PASSWORD=$(echo "$GPG_PASSWORD" | base32 -d); fi' \
            "  script:" \
            "    - |" \
            '      mkdir -p built_packages' \
            '      GPG_KEY_ID=$(cat gpg_key_id.txt 2>/dev/null || echo "")' \
            '      SIGN_ARG=""; [ -n "$GPG_KEY_ID" ] && SIGN_ARG="--sign $GPG_KEY_ID"' \
            '      echo "Building $PKG_FILE for $TARGET..."' \
            '      zoi package build "$PKG_FILE" --install-deps --platform "$TARGET" --method native -o built_packages $SIGN_ARG' \
            '      echo "Bundling .zsa for $PKG_FILE..."' \
            '      zoi package bundle "$PKG_FILE" -o built_packages' \
            '      PKG_JSON=$(zoi package inspect "$PKG_FILE" --json)' \
            '      PKG_NAME=$(echo "$PKG_JSON" | jq -r ".name")' \
            '      PKG_REPO=$(echo "$PKG_JSON" | jq -r ".repo")' \
            '      if [ -z "$PKG_REPO" ] || [ "$PKG_REPO" = "null" ]; then PKG_ID_UPLOAD="$PKG_NAME"; else PKG_ID_UPLOAD="$(echo "$PKG_REPO" | tr "/" ".").$PKG_NAME"; fi' \
            '      echo "Generating .zdelta for $PKG_FILE ($TARGET)..."' \
            '      NEW_ZPA=$(find built_packages -name "${PKG_NAME}-${PKG_VERSION}-*.zpa" | head -n 1)' \
            '      if [ -n "$NEW_ZPA" ]; then' \
            '        DELTA_OUT="built_packages/${PKG_NAME}-${PKG_VERSION}-${TARGET}.zdelta"' \
            '        VERSIONS_JSON_TMP=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=${PKG_ID_UPLOAD}&package_type=generic&sort=desc&order_by=created_at")' \
            '        PREV_VERSION=$(echo "$VERSIONS_JSON_TMP" | jq -r --arg V "$PKG_VERSION" ".[] | select(.version != \"latest\" and .version != \$V) | .version" | head -n 1)' \
            '        if [ -n "$PREV_VERSION" ]; then' \
            '          OLD_ZPA_TMP=$(mktemp --suffix=.zpa)' \
            '          if curl --fail --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o "$OLD_ZPA_TMP" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_ID_UPLOAD}/${PREV_VERSION}/${PKG_NAME}-${PREV_VERSION}-${TARGET}.zpa"; then' \
            '            DELTA_SIGN_ARG=""; [ -n "$GPG_KEY_ID" ] && DELTA_SIGN_ARG="--sign $GPG_KEY_ID"' \
            '            zoi package delta "$OLD_ZPA_TMP" "$NEW_ZPA" -o "$DELTA_OUT" $DELTA_SIGN_ARG || echo "Delta generation failed, continuing without .zdelta"' \
            '          else echo "No previous archive for $TARGET v$PREV_VERSION, skipping delta"; fi' \
            '          rm -f "$OLD_ZPA_TMP"' \
            '        else echo "No previous version found, skipping delta"; fi' \
            '      fi' \
            '      find built_packages -name "${PKG_NAME}-*" -type f | while read -r FILE; do FILENAME=$(basename "$FILE"); echo "Uploading $FILENAME to version $PKG_VERSION..."; curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$FILE" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_ID_UPLOAD}/${PKG_VERSION}/${FILENAME}"; done' \
            '      find built_packages -name "${PKG_NAME}-*" -type f | while read -r FILE; do FILENAME=$(basename "$FILE"); echo "Updating latest pointer for $FILENAME..."; curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$FILE" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_ID_UPLOAD}/latest/${FILENAME}"; done' \
            '      echo "Pruning old versions for ${PKG_ID_UPLOAD} (keeping last 3)..."' \
            '      VERSIONS_JSON=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=${PKG_ID_UPLOAD}&package_type=generic&sort=desc&order_by=created_at")' \
            '      ALL_VERSIONS=$(echo "$VERSIONS_JSON" | jq -r ".[] | select(.version != \"latest\") | .version" | uniq)' \
            '      KEEP_VERSIONS=$(echo "$ALL_VERSIONS" | head -n 3)' \
            '      for V in $ALL_VERSIONS; do' \
            '        if ! echo "$KEEP_VERSIONS" | grep -q "^$V$"; then' \
            '          echo "Deleting old version $V...";' \
            '          PACKAGE_ID=$(echo "$VERSIONS_JSON" | jq -r ".[] | select(.version == \"$V\") | .id" | head -n 1);' \
            '          curl --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}";' \
            '        fi;' \
            '      done' \
            "  artifacts:" \
            "    paths:" \
            "      - built_packages/" \
            "    expire_in: 1 day" \
            "" >> generated/child.yml
        done

        # ── macOS target ──
        MACOS_TARGET_LIST=""
        if [ -z "$PLATFORMS" ]; then
          MACOS_TARGET_LIST="macos-amd64 macos-arm64"
        else
          for PLATFORM in $PLATFORMS; do
            case "$PLATFORM" in
              ci:*) T="${PLATFORM#ci:}"; T="${T%%:*}"; R="${PLATFORM##*:}"
                    if [ "$R" = "macos" ]; then MACOS_TARGET_LIST="$MACOS_TARGET_LIST $T"; fi ;;
              macos) MACOS_TARGET_LIST="$MACOS_TARGET_LIST macos-amd64 macos-arm64" ;;
              macos-*) MACOS_TARGET_LIST="$MACOS_TARGET_LIST $PLATFORM" ;;
            esac
          done
        fi
        for TARGET in $MACOS_TARGET_LIST; do
          printf '%s\n' \
            "build-$TARGET-$PKG_ID:" \
            "  stage: build" \
            "  image: macos-26-xcode-26" \
            "  tags:" \
            "    - saas-macos-medium-m1" \
            "  variables:" \
            "    PKG_FILE: \"$PKG_FILE\"" \
            "    TARGET: \"$TARGET\"" \
            "    PKG_VERSION: \"$PKG_VERSION\"" \
            "  before_script:" \
            "    - |" \
            "      brew install jq gnupg" \
            "      curl -fsSL https://zillowe.pages.dev/scripts/zoi/install.sh | bash" \
            '      export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"' \
            "      zoi sync" \
            '      if [ -n "$GPG_PRIVATE_KEY" ]; then mkdir -p .gnupg; export GNUPGHOME="$(pwd)/.gnupg"; chmod 700 .gnupg; echo "allow-loopback-pinentry" > .gnupg/gpg-agent.conf; echo "pinentry-mode loopback" > .gnupg/gpg.conf; echo "$GPG_PRIVATE_KEY" | base32 -d | gpg --batch --pinentry-mode loopback --import; gpgconf --kill gpg-agent; GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep "^sec" | cut -d: -f5 | head -n 1); echo "$GPG_KEY_ID" > gpg_key_id.txt; fi' \
            '      if [ -n "$GPG_PASSWORD" ]; then export GPG_PASSWORD=$(echo "$GPG_PASSWORD" | base32 -d); fi' \
            "  script:" \
            "    - |" \
            '      mkdir -p built_packages' \
            '      GPG_KEY_ID=$(cat gpg_key_id.txt 2>/dev/null || echo "")' \
            '      SIGN_ARG=""; [ -n "$GPG_KEY_ID" ] && SIGN_ARG="--sign $GPG_KEY_ID"' \
            '      echo "Building $PKG_FILE for $TARGET..."' \
            '      zoi package build "$PKG_FILE" --install-deps --platform "$TARGET" --method native -o built_packages $SIGN_ARG' \
            '      echo "Bundling .zsa for $PKG_FILE..."' \
            '      zoi package bundle "$PKG_FILE" -o built_packages' \
            '      PKG_JSON=$(zoi package inspect "$PKG_FILE" --json)' \
            '      PKG_NAME=$(echo "$PKG_JSON" | jq -r ".name")' \
            '      PKG_REPO=$(echo "$PKG_JSON" | jq -r ".repo")' \
            '      if [ -z "$PKG_REPO" ] || [ "$PKG_REPO" = "null" ]; then PKG_ID_UPLOAD="$PKG_NAME"; else PKG_ID_UPLOAD="$(echo "$PKG_REPO" | tr "/" ".").$PKG_NAME"; fi' \
            '      echo "Generating .zdelta for $PKG_FILE ($TARGET)..."' \
            '      NEW_ZPA=$(find built_packages -name "${PKG_NAME}-${PKG_VERSION}-*.zpa" | head -n 1)' \
            '      if [ -n "$NEW_ZPA" ]; then' \
            '        DELTA_OUT="built_packages/${PKG_NAME}-${PKG_VERSION}-${TARGET}.zdelta"' \
            '        VERSIONS_JSON_TMP=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=${PKG_ID_UPLOAD}&package_type=generic&sort=desc&order_by=created_at")' \
            '        PREV_VERSION=$(echo "$VERSIONS_JSON_TMP" | jq -r --arg V "$PKG_VERSION" ".[] | select(.version != \"latest\" and .version != \$V) | .version" | head -n 1)' \
            '        if [ -n "$PREV_VERSION" ]; then' \
            '          OLD_ZPA_TMP=$(mktemp /tmp/old-XXXXXX.zpa)' \
            '          if curl --fail --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o "$OLD_ZPA_TMP" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_ID_UPLOAD}/${PREV_VERSION}/${PKG_NAME}-${PREV_VERSION}-${TARGET}.zpa"; then' \
            '            DELTA_SIGN_ARG=""; [ -n "$GPG_KEY_ID" ] && DELTA_SIGN_ARG="--sign $GPG_KEY_ID"' \
            '            zoi package delta "$OLD_ZPA_TMP" "$NEW_ZPA" -o "$DELTA_OUT" $DELTA_SIGN_ARG || echo "Delta generation failed, continuing without .zdelta"' \
            '          else echo "No previous archive for $TARGET v$PREV_VERSION, skipping delta"; fi' \
            '          rm -f "$OLD_ZPA_TMP"' \
            '        else echo "No previous version found, skipping delta"; fi' \
            '      fi' \
            '      find built_packages -name "${PKG_NAME}-*" -type f | while read -r FILE; do FILENAME=$(basename "$FILE"); echo "Uploading $FILENAME to version $PKG_VERSION..."; curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$FILE" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_ID_UPLOAD}/${PKG_VERSION}/${FILENAME}"; done' \
            '      find built_packages -name "${PKG_NAME}-*" -type f | while read -r FILE; do FILENAME=$(basename "$FILE"); echo "Updating latest pointer for $FILENAME..."; curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$FILE" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_ID_UPLOAD}/latest/${FILENAME}"; done' \
            '      echo "Pruning old versions for ${PKG_ID_UPLOAD} (keeping last 3)..."' \
            '      VERSIONS_JSON=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=${PKG_ID_UPLOAD}&package_type=generic&sort=desc&order_by=created_at")' \
            '      ALL_VERSIONS=$(echo "$VERSIONS_JSON" | jq -r ".[] | select(.version != \"latest\") | .version" | uniq)' \
            '      KEEP_VERSIONS=$(echo "$ALL_VERSIONS" | head -n 3)' \
            '      for V in $ALL_VERSIONS; do' \
            '        if ! echo "$KEEP_VERSIONS" | grep -q "^$V$"; then' \
            '          echo "Deleting old version $V...";' \
            '          PACKAGE_ID=$(echo "$VERSIONS_JSON" | jq -r ".[] | select(.version == \"$V\") | .id" | head -n 1);' \
            '          curl --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}";' \
            '        fi;' \
            '      done' \
            "  artifacts:" \
            "    paths:" \
            "      - built_packages/" \
            "    expire_in: 1 day" \
            "" >> generated/child.yml
        done

        # ── Windows target ──
        WIN_TARGET_LIST=""
        if [ -z "$PLATFORMS" ] || echo "$PLATFORMS" | grep -q "windows\|ci:.*:windows"; then
          WIN_TARGET_LIST="windows-amd64"
          if [ -n "$PLATFORMS" ]; then
            WIN_TARGET_LIST=""
            for PLATFORM in $PLATFORMS; do
              case "$PLATFORM" in
                ci:*) T="${PLATFORM#ci:}"; T="${T%%:*}"; R="${PLATFORM##*:}"
                      if [ "$R" = "windows" ]; then WIN_TARGET_LIST="$WIN_TARGET_LIST $T"; fi ;;
                windows|windows-*) WIN_TARGET_LIST="$WIN_TARGET_LIST $PLATFORM" ;;
              esac
            done
          fi
        fi
        for TARGET in $WIN_TARGET_LIST; do
          printf '%s\n' \
            "build-$TARGET-$PKG_ID:" \
            "  stage: build" \
            "  tags:" \
            "    - saas-windows-medium-amd64" \
            "  variables:" \
            "    PKG_FILE: \"$PKG_FILE\"" \
            "    PKG_VERSION: \"$PKG_VERSION\"" \
            "    TARGET: \"$TARGET\"" \
            "  before_script:" \
            '    - choco install jq -y' \
            '    - powershell -c "irm zillowe.pages.dev/scripts/zoi/install.ps1|iex"' \
            "    - zoi sync" \
            '    - |' \
            '      if ($env:GPG_PRIVATE_KEY) {' \
            '        New-Item -ItemType Directory -Force -Path .gnupg' \
            '        $env:GNUPGHOME = "$(Get-Location)/.gnupg"' \
            '        Set-Content -Path .gnupg/gpg-agent.conf -Value "allow-loopback-pinentry"' \
            '        Set-Content -Path .gnupg/gpg.conf -Value "pinentry-mode loopback"' \
            '        # Use bash for decoding and importing as it is easier than native PowerShell base32' \
            '        bash -c "echo $GPG_PRIVATE_KEY | base32 -d | gpg --batch --import"' \
            '        gpgconf --kill gpg-agent' \
            '        $GPG_KEY_ID = (gpg --list-secret-keys --with-colons | Select-String "^sec" | ForEach-Object { $_.ToString().Split(":")[4] } | Select-Object -First 1)' \
            '        $GPG_KEY_ID | Out-File -FilePath gpg_key_id.txt -NoNewline' \
            '      }' \
            '      if ($env:GPG_PASSWORD) {' \
            '        $env:GPG_PASSWORD = bash -c "echo $env:GPG_PASSWORD | base32 -d"' \
            '      }' \
            "  script:" \
            "    - |" \
            '      New-Item -ItemType Directory -Force -Path built_packages' \
            '      $GpgKeyId = if (Test-Path gpg_key_id.txt) { Get-Content gpg_key_id.txt } else { "" }' \
            '      $SignArg = if ($GpgKeyId) { "--sign $GpgKeyId" } else { "" }' \
            '      Write-Host "Building $env:PKG_FILE for $env:TARGET..."' \
            '      zoi package build "$env:PKG_FILE" --install-deps --platform "$env:TARGET" --method native -o built_packages $SignArg' \
            '      Write-Host "Bundling .zsa for $env:PKG_FILE..."' \
            '      zoi package bundle "$env:PKG_FILE" -o built_packages' \
            '      $PkgJson = (zoi package inspect "$env:PKG_FILE" --json | ConvertFrom-Json)' \
            '      $PkgName = $PkgJson.name' \
            '      $PkgRepo = $PkgJson.repo' \
            '      $PkgIdUpload = if ($PkgRepo -eq $null -or $PkgRepo -eq "null" -or $PkgRepo -eq "") { $PkgName } else { $PkgRepo.Replace("/", ".") + "." + $PkgName }' \
            '      Write-Host "Generating .zdelta for $env:PKG_FILE ($env:TARGET)..."' \
            '      $NewZpa = Get-ChildItem -Path built_packages -Filter "$($PkgName)-$($env:PKG_VERSION)-*.zpa" | Select-Object -First 1' \
            '      if ($NewZpa) {' \
            '        $DeltaOut = "built_packages/$($PkgName)-$($env:PKG_VERSION)-$($env:TARGET).zdelta"' \
            '        $VersionsJsonRaw = curl.exe --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=$PkgIdUpload&package_type=generic&sort=desc&order_by=created_at"' \
            '        $PrevVersion = @($VersionsJsonRaw | ConvertFrom-Json | Where-Object { $_.version -ne "latest" -and $_.version -ne $env:PKG_VERSION } | Select-Object -ExpandProperty version -Unique) | Select-Object -First 1' \
            '        if ($PrevVersion) {' \
            '          $OldZpaTmp = [System.IO.Path]::GetTempFileName() + ".zpa"' \
            '          $OldUrl = "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/$PkgIdUpload/$PrevVersion/$($PkgName)-$PrevVersion-$($env:TARGET).zpa"' \
            '          curl.exe --fail --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o $OldZpaTmp $OldUrl' \
            '          if ($LASTEXITCODE -eq 0) {' \
            '            $DeltaSignArg = if ($GpgKeyId) { "--sign $GpgKeyId" } else { "" }' \
            '            zoi package delta $OldZpaTmp $NewZpa.FullName -o $DeltaOut $DeltaSignArg' \
            '            if ($LASTEXITCODE -ne 0) { Write-Host "Delta generation failed, continuing without .zdelta" }' \
            '          } else { Write-Host "No previous archive for $($env:TARGET) v$PrevVersion, skipping delta" }' \
            '          Remove-Item -Force $OldZpaTmp -ErrorAction SilentlyContinue' \
            '        } else { Write-Host "No previous version found, skipping delta" }' \
            '      }' \
            '      Get-ChildItem -Path built_packages -Filter "${PkgName}-*" | ForEach-Object {' \
            '        $FileName = $_.Name' \
            '        Write-Host "Uploading $FileName to version $env:PKG_VERSION..."' \
            '        curl.exe --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $_.FullName "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PkgIdUpload}/${env:PKG_VERSION}/$FileName"' \
            '        Write-Host "Updating latest pointer for $FileName..."' \
            '        curl.exe --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file $_.FullName "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PkgIdUpload}/latest/$FileName"' \
            '      }' \
            '      Write-Host "Pruning old versions for $PkgIdUpload (keeping last 3)..."' \
            '      $VersionsJsonRaw2 = curl.exe --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=$PkgIdUpload&package_type=generic&sort=desc&order_by=created_at"' \
            '      $AllPackages = @($VersionsJsonRaw2 | ConvertFrom-Json)' \
            '      $AllVersions = @($AllPackages | Where-Object { $_.version -ne "latest" } | Select-Object -ExpandProperty version -Unique)' \
            '      $KeepVersions = @($AllVersions | Select-Object -First 3)' \
            '      foreach ($V in $AllVersions) {' \
            '        if ($KeepVersions -notcontains $V) {' \
            '          Write-Host "Deleting old version $V..."' \
            '          $PackageId = ($AllPackages | Where-Object { $_.version -eq $V } | Select-Object -First 1).id' \
            '          curl.exe --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/$PackageId"' \
            '        }' \
            '      }' \
            "  artifacts:" \
            "    paths:" \
            "      - built_packages/" \
            "    expire_in: 1 day" \
            "" >> generated/child.yml
        done
      done
      if [ "$(wc -l < generated/child.yml)" -le 8 ]; then
        printf '%s\n' \
          "noop:" \
          "  stage: build" \
          '  script: echo "No packages changed, nothing to build"' \
          "" >> generated/child.yml
      fi
  artifacts:
    paths:
      - generated/

trigger-child:
  stage: build
  needs:
    - generate-child
  trigger:
    include:
      - artifact: generated/child.yml
        job: generate-child
    strategy: depend
