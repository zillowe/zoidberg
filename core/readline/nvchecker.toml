["readline:major"]
source = "regex"
url = "https://ftp.gnu.org/gnu/readline/"
regex = 'readline-(\d+\.\d+)\.tar\.gz'

["readline:patch"]
source = "regex"
url = "https://ftp.gnu.org/gnu/readline/readline-8.3-patches/"
regex = 'readline83-0*(\d+)'

[readline]
source = "combiner"
from = ["readline:major", "readline:patch"]
format = "$1.$2"
