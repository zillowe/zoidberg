name: systemd-daemon-reload-user
description: Reloading user manager configuration...
platforms: ["linux"]
trigger:
  dirs:
    - "${usrroot}/usr/lib/systemd/user"
  operation: ["install", "upgrade", "remove"]
action:
  when: PostTransaction
  exec: |
    if [ -x /usr/lib/systemd/systemd-hook ]; then
      /usr/lib/systemd/systemd-hook daemon-reload-user
    fi
