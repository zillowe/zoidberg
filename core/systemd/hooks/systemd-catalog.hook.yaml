name: systemd-catalog
description: Updating journal message catalog...
platforms: ["linux"]
trigger:
  dirs:
    - "${usrroot}/usr/lib/systemd/catalog"
  operation: ["install", "upgrade", "remove"]
action:
  when: PostTransaction
  exec: |
    if [ -x /usr/lib/systemd/systemd-hook ]; then
      /usr/lib/systemd/systemd-hook catalog
    elif [ -x /usr/bin/journalctl ]; then
      /usr/bin/journalctl --update-catalog
    fi
